name: Maven CI

on:
  push:
  pull_request:

jobs:
  clean-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify all Maven modules
        run: mvn --batch-mode --no-transfer-progress clean verify
